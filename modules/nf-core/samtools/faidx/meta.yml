---
name: "nf-core/samtools/faidx"
description: "Index FASTA file, and optionally generate a file of chromosome sizes"
keywords:
- "index"
- "fasta"
- "faidx"
- "chromosome"
tools:
- samtools:
    description: "SAMtools is a set of utilities for interacting with and post-processing\n\
      short DNA sequence read alignments in the SAM, BAM and CRAM formats, written\
      \ by Heng Li.\nThese files are generated as output by short read aligners like\
      \ BWA.\n"
    homepage: "http://www.htslib.org/"
    documentation: "http://www.htslib.org/doc/samtools.html"
    doi: "10.1093/bioinformatics/btp352"
    licence:
    - "MIT"
    identifier: "biotools:samtools"
input:
- - meta:
      type: "map"
      description: "Groovy Map containing reference information\ne.g. [ id:'test'\
        \ ]\n"
  - fasta:
      type: "file"
      description: "FASTA file"
      pattern: "*.{fa,fasta}"
      ontologies: []
  - fai:
      type: "file"
      description: "FASTA index file"
      pattern: "*.{fai}"
      ontologies: []
- get_sizes:
    type: "boolean"
    description: "use cut to get the sizes of the index (true) or not (false)"
output:
  fa:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test',\
          \ single_end:false ]\n"
    - '*.{fa,fasta}':
        type: "file"
        description: "FASTA file"
        pattern: "*.{fa}"
        ontologies: []
  sizes:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test',\
          \ single_end:false ]\n"
    - '*.sizes':
        type: "file"
        description: "File containing chromosome lengths"
        pattern: "*.{sizes}"
        ontologies: []
  fai:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test',\
          \ single_end:false ]\n"
    - '*.fai':
        type: "file"
        description: "FASTA index file"
        pattern: "*.{fai}"
        ontologies: []
  gzi:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test',\
          \ single_end:false ]\n"
    - '*.gzi':
        type: "file"
        description: "Optional gzip index file for compressed inputs"
        pattern: "*.gzi"
        ontologies: []
  versions_samtools:
  - - ${task.process}:
        type: "string"
        description: "The process the versions were collected from"
    - samtools:
        type: "string"
        description: "The tool name"
    - samtools version | sed '1!d;s/.* //':
        type: "eval"
        description: "The command used to generate the version of the tool"
topics:
  versions:
  - - ${task.process}:
        type: "string"
        description: "The process the versions were collected from"
    - samtools:
        type: "string"
        description: "The tool name"
    - samtools version | sed '1!d;s/.* //':
        type: "eval"
        description: "The command used to generate the version of the tool"
authors:
- "@drpatelh"
- "@ewels"
- "@phue"
maintainers:
- "@maxulysse"
- "@phue"
- "@matthdsm"
version: "0.0.0-0c7146d"
license: "MIT License"
