---
name: "nf-core/wisecondorx/convert"
description: "Convert and filter aligned reads to .npz"
keywords:
- "bam"
- "cram"
- "copy-number"
tools:
- wisecondorx:
    description: "WIthin-SamplE COpy Number aberration DetectOR, including sex chromosomes"
    homepage: "https://github.com/CenterForMedicalGeneticsGhent/WisecondorX"
    documentation: "https://github.com/CenterForMedicalGeneticsGhent/WisecondorX"
    tool_dev_url: "https://github.com/CenterForMedicalGeneticsGhent/WisecondorX"
    doi: "10.1093/nar/gky1263"
    licence:
    - "Attribution-NonCommercial-ShareAlike CC BY-NC-SA"
    identifier: ""
input:
- - meta:
      type: "map"
      description: "Groovy Map containing sample information\ne.g. [ id:'test', single_end:false\
        \ ]\n"
  - bam:
      type: "file"
      description: "Reads in BAM/CRAM format"
      pattern: "*.{bam,cram}"
      ontologies: []
  - bai:
      type: "file"
      description: "index of the BAM/CRAM file"
      pattern: "*.{bai,crai}"
      ontologies: []
- - meta2:
      type: "map"
      description: "Groovy Map containing reference fasta meta information\ne.g. [\
        \ id:'test' ]\n"
  - fasta:
      type: "file"
      description: "The reference FASTA file (mandatory when using CRAM files)"
      pattern: "*.{fasta,fa,fna}"
      ontologies: []
- - meta3:
      type: "map"
      description: "Groovy Map containing reference fasta index meta information\n\
        e.g. [ id:'test' ]\n"
  - fasta_fai:
      type: "file"
      description: "The index of the reference FASTA file (mandatory when using CRAM\
        \ files)"
      pattern: "*.fai"
      ontologies: []
output:
  npz:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test',\
          \ single_end:false ]\n"
    - '*.npz':
        type: "file"
        description: "The output NPZ file"
        pattern: "*.npz"
        ontologies: []
  versions_wisecondorx:
  - - ${task.process}:
        type: "string"
        description: "The name of the process"
    - wisecondorx:
        type: "string"
        description: "The name of the tool"
    - pip list |& sed -n 's/wisecondorx *//p':
        type: "eval"
        description: "The expression to obtain the version of the tool"
topics:
  versions:
  - - ${task.process}:
        type: "string"
        description: "The name of the process"
    - wisecondorx:
        type: "string"
        description: "The name of the tool"
    - pip list |& sed -n 's/wisecondorx *//p':
        type: "eval"
        description: "The expression to obtain the version of the tool"
authors:
- "@nvnieuwk"
maintainers:
- "@nvnieuwk"
version: "0.0.0-0c7146d"
license: "MIT License"
